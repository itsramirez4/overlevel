name: Cron - Cleanup Refresh Tokens

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/internal/cron/cleanup-tokens
        run: |
          curl -sf -X POST "${{ vars.BACKEND_URL }}/api/internal/cron/cleanup-tokens" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 90 --retry 5 --retry-delay 15 --retry-all-errors
