name: Weekly Database Backup

# Supabase's free tier has no point-in-time recovery and very limited
# built-in backup retention — this is the free alternative: a full pg_dump,
# stored as a GitHub Actions artifact (free, no external storage needed).
# retention-days below keeps roughly the last 8 weekly backups before
# GitHub auto-expires the older ones, so this doesn't grow without bound.
on:
  schedule:
    - cron: '0 3 * * 0' # Sundays 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # Ephemeral, isolated to this job only — lives and dies with the runner,
    # never touches the real project. This is what proves the dump is
    # actually restorable, not just that pg_dump exited 0: a backup nobody
    # has ever restored is a promise, not a guarantee.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install PostgreSQL client
        # Ubuntu noble's own postgresql-client package is v16, but Supabase
        # runs Postgres 17 — pg_dump refuses to dump from a newer server
        # than itself ("aborting because of server version mismatch").
        # apt.postgresql.org.sh adds the PGDG repo, which carries current
        # major versions Ubuntu's own repos lag behind.
        run: |
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Set backup filename
        id: vars
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Dump database
        # The direct connection host (db.<ref>.supabase.co) resolves IPv6-only
        # and GitHub Actions runners have no IPv6 route ("Network is
        # unreachable") — the session pooler is Supabase's own recommended
        # workaround for exactly this case, since it resolves over IPv4.
        # Pooler connections need the project ref appended to the username.
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump \
            --host=aws-0-eu-west-1.pooler.supabase.com \
            --port=5432 \
            --username=postgres.kyzpbwrmtrppngivhiec \
            --dbname=postgres \
            --no-owner --no-acl \
            --format=plain \
            --file=backup-${{ steps.vars.outputs.date }}.sql
          gzip backup-${{ steps.vars.outputs.date }}.sql

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.vars.outputs.date }}
          path: backup-${{ steps.vars.outputs.date }}.sql.gz
          retention-days: 60

      - name: Verify the dump actually restores
        # Deliberately NOT ON_ERROR_STOP=1 — the dump also contains
        # Supabase-internal bits (auth/storage schemas, its own roles,
        # extensions) that don't exist on a bare postgres:17 image and are
        # expected to fail here; what matters is that this app's own tables
        # and data come back. Fails the job if they don't.
        env:
          PGPASSWORD: postgres
        run: |
          gunzip -k backup-${{ steps.vars.outputs.date }}.sql.gz
          psql --host=localhost --port=5432 --username=postgres --dbname=postgres \
            -f backup-${{ steps.vars.outputs.date }}.sql > restore.log 2>&1 || true

          echo "--- Tables present after restore ---"
          psql --host=localhost --port=5432 --username=postgres --dbname=postgres -c "\dt public.*"

          echo "--- Row counts ---"
          psql --host=localhost --port=5432 --username=postgres --dbname=postgres -c "
            SELECT 'users' AS table_name, count(*) FROM users
            UNION ALL SELECT 'exercises', count(*) FROM exercises
            UNION ALL SELECT 'workouts', count(*) FROM workouts
            UNION ALL SELECT 'sets', count(*) FROM sets;
          "

          USER_COUNT=$(psql --host=localhost --port=5432 --username=postgres --dbname=postgres -tAc "SELECT count(*) FROM users;")
          if [ "$USER_COUNT" -lt 1 ]; then
            echo "::error::Restored database has no users — the backup did not actually restore real data. Full restore log:"
            cat restore.log
            exit 1
          fi
          echo "Restore verified: $USER_COUNT user(s) present."
