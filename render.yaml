services:
  - type: web
    name: overlevel-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # --include=dev: NODE_ENV=production below makes npm skip
    # devDependencies by default (typescript, @types/*, ts-jest) — without
    # this the build falls back to some other resolved tsc entirely and
    # fails in confusing ways instead of just saying tsc is missing.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE_ACCESS
        value: 15m
      - key: JWT_EXPIRE_REFRESH
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: ENABLE_CRON_JOBS
        value: false
      - key: LOG_LEVEL
        value: info
      # Secrets — Render prompts for these during Blueprint setup instead of
      # storing them in this file. Same values as the ones already in use.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
